[project]
name = "healthcare-rag"
version = "0.1.0"
description = "Healthcare RAG Intelligence Platform - grounded answers with citations over medical literature"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # config / cli
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    # ingestion
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pypdf>=4.2",
    "lxml>=5.2",
    "tiktoken>=0.7",
    # ml / retrieval
    "numpy>=1.26",
    "pandas>=2.2",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "faiss-cpu>=1.8",
    "qdrant-client>=1.9",
    # generation
    "openai>=1.40",
    # serving
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.36",
    "plotly>=5.22",
    # aws (optional document store)
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "matplotlib>=3.9",
]

[project.scripts]
hcrag = "src.cli:app"

[tool.setuptools.packages.find]
include = ["src*", "api*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is handled by the formatter.
# B008: FastAPI's Depends()/File() defaults are the documented idiom.
# B905: zip() strict= adds noise where the inputs are built together and
#       already guaranteed equal length.
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
# Both must extend sys.path before importing the package, so imports cannot
# all sit at the top of the file.
"frontend/app.py" = ["E402"]
"notebooks/*.ipynb" = ["E402", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
